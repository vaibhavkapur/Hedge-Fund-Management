[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-fund-fee-accounting-engine"
version = "0.1.0"
description = "Educational/research prototype for deterministic hedge fund management and performance fee accounting with Decimal arithmetic and immutable SQLite journaling."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Trading-Management Contributors"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9.0"
]

[project.scripts]
fee-engine = "hedge_fund_fee_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
