[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pb-collateral-management"
version = "0.1.0"
description = "Prime Broker Collateral Management: collateral eligibility, encumbrance, financing accruals, statement reconciliation, margin call workflow, and substitution review."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Trading-Management Contributors"}
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
dev = ["pytest==8.3.3"]

[project.scripts]
pb-collateral = "pb_collateral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
