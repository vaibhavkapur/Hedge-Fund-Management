[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-performance-and-investor-reporting-dashboard"
version = "0.1.0"
description = "Reconciled fund performance analytics, strategy exposure dashboard, and versioned investor reporting with RBAC and approval controls."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.4"]

[project.scripts]
fund-reporting-server = "fund_reporting.api.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
