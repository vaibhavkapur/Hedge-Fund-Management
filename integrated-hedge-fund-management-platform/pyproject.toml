[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-hedge-fund-management-platform"
version = "0.1.0"
description = "Unified hedge fund control plane for portfolio accounting, consolidated risk, multi-way reconciliation, daily close, role-separated approvals, versioned reporting, and immutable audit history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
hfp = "hf_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_platform = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
