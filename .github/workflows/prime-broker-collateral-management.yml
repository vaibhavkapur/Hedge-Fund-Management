name: Prime Broker Collateral Management CI

on:
  push:
    paths:
      - "prime-broker-collateral-management/**"
      - ".github/workflows/prime-broker-collateral-management.yml"
  pull_request:
    paths:
      - "prime-broker-collateral-management/**"
      - ".github/workflows/prime-broker-collateral-management.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prime-broker-collateral-management

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit, integration, and boundary tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Run deterministic demo and report checks
        run: |
          PYTHONPATH=src python3 scripts/run_demo.py --output /tmp/demo_check.json
          PYTHONPATH=src python3 scripts/verify_reproducibility.py
