name: Hedge Fund Fee Accounting Engine CI

on:
  push:
    paths:
      - "hedge-fund-fee-accounting-engine/**"
      - ".github/workflows/hedge-fund-fee-accounting-engine.yml"
  pull_request:
    paths:
      - "hedge-fund-fee-accounting-engine/**"
      - ".github/workflows/hedge-fund-fee-accounting-engine.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    defaults:
      run:
        working-directory: hedge-fund-fee-accounting-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full validation suite
        run: bash scripts/validate_all.sh
