name: Regulatory Reporting Engine CI

on:
  push:
    paths:
      - "regulatory-reporting-engine/**"
      - ".github/workflows/regulatory-reporting-engine.yml"
  pull_request:
    paths:
      - "regulatory-reporting-engine/**"
      - ".github/workflows/regulatory-reporting-engine.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: regulatory-reporting-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit, integration, and operational tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Run reproducible end-to-end demo
        run: python3 scripts/run_demo.py

      - name: Run acceptance checks and oracle verification
        run: python3 scripts/run_acceptance.py

      - name: Verify CLI smoke commands
        run: |
          PYTHONPATH=src python3 -m regulatory_reporting_engine.cli list-profiles
          PYTHONPATH=src python3 -m regulatory_reporting_engine.cli validate-snapshot data/fixtures/reference_snapshot_q1_2026.json
          PYTHONPATH=src python3 -m regulatory_reporting_engine.cli schema-diff --profile US_SEC_PF_ILLUSTRATIVE --from-version 1.0.0 --to-version 2.0.0
