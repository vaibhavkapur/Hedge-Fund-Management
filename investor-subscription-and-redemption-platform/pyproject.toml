[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-subscription-redemption-platform"
version = "0.1.0"
description = "Educational prototype modeling reviewed investor subscriptions, redemptions, cash reconciliation, share register, and immutable audit history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Trading-Management Contributors" }
]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "pydantic==2.10.3",
]
postgres = [
  "psycopg[binary]==3.2.3",
]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
